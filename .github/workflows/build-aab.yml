name: Build Transiva Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode Keystore
        run: |
          printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/transiva-release.jks
          ls -lh app/transiva-release.jks

      - name: Build Release Signed APK and AAB
        run: |
          gradle clean assembleRelease bundleRelease
        env:
          KEYSTORE_FILE: transiva-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: transiva-release-signed-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: transiva-release-signed-aab
          path: app/build/outputs/bundle/release/*.aab
