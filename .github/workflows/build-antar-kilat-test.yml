name: Build Antar Kilat Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK 36
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -f "$sdk_root/platforms/android-36/android.jar" ]]; then
            sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdkmanager" ]]; then
              for candidate in "$sdk_root"/cmdline-tools/*/bin/sdkmanager; do
                if [[ -x "$candidate" ]]; then
                  sdkmanager="$candidate"
                  break
                fi
              done
            fi
            if [[ ! -x "$sdkmanager" ]]; then
              echo "::error::Android SDK 36 and SDK command-line tools are missing under $sdk_root"
              exit 1
            fi
            "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-36'
          fi
          test -f "$sdk_root/platforms/android-36/android.jar"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle :antar-kilat-test:assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: Antar-Kilat-Uji-APK
          path: antar-kilat-test/build/outputs/apk/debug/antar-kilat-test-debug.apk
          if-no-files-found: error
