name: Build Antar Kilat Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36'
      - name: Build debug APK
        run: gradle :antar-kilat-test:assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: Antar-Kilat-Uji-APK
          path: antar-kilat-test/build/outputs/apk/debug/antar-kilat-test-debug.apk
          if-no-files-found: error
