name: Build Transiva Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-reliability:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: integration-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - name: Verify backend test source fingerprints
        run: python3 tools/reliability/verify_sources.py
      - name: Install PHP database extension
        run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql php-mbstring
      - name: Test chat failure and pagination fixtures
        run: php -n tools/reliability/chat_fixture_regression.php tools/reliability/chat-server
      - name: Test deployed chat endpoints and pagination with real SQL
        env:
          TEST_DB_PASSWORD: integration-only
        run: python3 tools/reliability/chat_server_regression.py
      - name: Test final wallet receipts, notification delivery, and alarm retries
        run: |
          set -euo pipefail
          python3 tools/reliability/wallet_final_regression.py tools/reliability/wallet-server | tee wallet-final.log
          php -n tools/reliability/wallet_notification_regression.php tools/reliability/wallet-server | tee wallet-notification.log
          php -n tools/reliability/wallet_alert_regression.php tools/reliability/wallet-server | tee wallet-alert.log
      - name: Test profile schema compatibility
        run: python3 tools/reliability/profile_server_regression.py
      - name: Test production escrow helper with controlled failures
        run: |
          set -euo pipefail
          php -n tools/reliability/settlement_mock.php | tee settlement-helper.log
      - name: Test real TransSend settlement and worker SQL
        env:
          TEST_DB_PASSWORD: integration-only
        run: |
          set -euo pipefail
          php tools/reliability/transaction_integration.php | tee transaction-integration.log
      - name: Upload transaction report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: transaction-integration-report
          path: |
            transaction-integration.log
            settlement-helper.log
            wallet-final.log
            wallet-notification.log
            wallet-alert.log
          if-no-files-found: warn

  build:
    needs: backend-reliability
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Decode Keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.KEYSTORE_BASE64 }}"
          printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/transiva-release.jks
          test -s app/transiva-release.jks

      # The project has two distribution flavors: direct and play.
      # testDebugUnitTest is ambiguous after flavors are enabled, therefore
      # run both concrete variant tasks explicitly.
      - name: Run Customer Regression Tests
        run: gradle :app:testDirectDebugUnitTest :app:testPlayDebugUnitTest

      - name: Test chat callbacks, saturation recovery, durable sends, and wallet runtime
        shell: bash
        run: |
          set -euo pipefail
          JSON_JAR=$(find "$HOME/.gradle/caches" -path '*/org.json/json/20240303/*/json-20240303.jar' -print -quit)
          test -f "$JSON_JAR"
          export JSON_JAR
          python3 tools/reliability/wallet_runtime_regression.py | tee wallet-runtime.log
          python3 tools/reliability/chat_runtime_regression.py | tee chat-runtime.log
      - name: Test real profile cache concurrency and session isolation
        shell: bash
        run: |
          set -euo pipefail
          JSON_JAR=$(find "$HOME/.gradle/caches" -path '*/org.json/json/20240303/*/json-20240303.jar' -print -quit)
          test -f "$JSON_JAR"
          export JSON_JAR
          python3 tools/reliability/profile_cache_regression.py | tee profile-cache-regression.log

      - name: Verify Regression Tests Actually Ran
        shell: bash
        run: |
          set -euo pipefail

          DIRECT_DIR="app/build/test-results/testDirectDebugUnitTest"
          PLAY_DIR="app/build/test-results/testPlayDebugUnitTest"

          test -d "$DIRECT_DIR"
          test -d "$PLAY_DIR"

          count_tests() {
            local dir="$1"
            grep -Rho 'tests="[0-9]*"' "$dir"/*.xml 2>/dev/null \
              | sed -E 's/tests="([0-9]+)"/\1/' \
              | awk '{s+=$1} END {print s+0}'
          }

          DIRECT_COUNT=$(count_tests "$DIRECT_DIR")
          PLAY_COUNT=$(count_tests "$PLAY_DIR")
          TOTAL_COUNT=$((DIRECT_COUNT + PLAY_COUNT))

          echo "Direct regression tests executed: $DIRECT_COUNT"
          echo "Play regression tests executed:   $PLAY_COUNT"
          echo "Total regression tests executed:  $TOTAL_COUNT"

          test "$DIRECT_COUNT" -ge 46
          test "$PLAY_COUNT" -ge 46

      - name: Upload Regression Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: customer-regression-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            profile-cache-regression.log
            wallet-runtime.log
            chat-runtime.log
          if-no-files-found: warn

      # Direct = APK for your own server/distribution.
      # Play   = AAB intended for Google Play.
      - name: Build Direct Signed APK and Play Signed AAB
        run: gradle :app:assembleDirectRelease :app:bundlePlayRelease
        env:
          KEYSTORE_FILE: transiva-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Direct Signed APK
        uses: actions/upload-artifact@v6
        with:
          name: transiva-direct-release-signed-apk
          path: app/build/outputs/apk/direct/release/*.apk
          if-no-files-found: error

      - name: Upload Play Signed AAB
        uses: actions/upload-artifact@v6
        with:
          name: transiva-play-release-signed-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
