name: Play Release WebRTC Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Create temporary test-only signing key
        run: keytool -genkeypair -keystore app/transiva-release.jks -storetype PKCS12 -storepass smoke-test-only -keypass smoke-test-only -alias smoke -keyalg RSA -validity 2 -dname 'CN=Release Smoke Only'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native WebRTC checks on minified Play release
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KEYSTORE_PASSWORD: smoke-test-only
          KEY_PASSWORD: smoke-test-only
          KEY_ALIAS: smoke
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedPlayReleaseAndroidTest -PtransivaLocalVerification --stacktrace
      - name: Verify native WebRTC lookup names after R8
        run: python3 tools/reliability/verify_webrtc_jni.py app/build/outputs/mapping/playRelease/mapping.txt
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: play-release-webrtc-smoke-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/mapping/playRelease/
          if-no-files-found: warn
