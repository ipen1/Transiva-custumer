plugins {
    id 'com.android.application'
}

def customerSources = rootProject.file('app/src/main')
// Stage only the shared game classes in the test module's Java source tree.
def gameJava = layout.buildDirectory.dir('generated/gameJava')
def copyGameJava = tasks.register('copyGameJava', Sync) {
    from new File(customerSources, 'java')
    include 'com/transiva/app/AntarKilatGameView.java',
            'com/transiva/app/AntarKilatRoadView.java',
            'com/transiva/app/AntarKilatPerspective.java',
            'com/transiva/app/AntarKilatVillage.java',
            'com/transiva/app/AntarKilatRound.java'
    into gameJava
}

def gameResources = layout.buildDirectory.dir('generated/gameResources')
def copyGameResources = tasks.register('copyGameResources', Sync) {
    from new File(customerSources, 'res')
    include 'drawable-nodpi/antar_kilat_*.webp', 'raw/antar_kilat_*.wav'
    exclude 'drawable-nodpi/antar_kilat_street.webp'
    into gameResources
}

android {
    namespace 'com.transiva.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.transiva.antarkilat.test'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            java.srcDir gameJava
            res.srcDir gameResources
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn copyGameJava, copyGameResources
}
