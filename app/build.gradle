plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.transiva.app'
    flavorDimensions 'distribution'

    productFlavors {
        direct {
            dimension 'distribution'
            buildConfigField 'boolean', 'SELF_UPDATE_APK', 'true'
        }
        play {
            // Required by the enabled Google Play automatic protection.
            // Direct APK keeps the default minSdk 23.
            minSdk 24
            dimension 'distribution'
            buildConfigField 'boolean', 'SELF_UPDATE_APK', 'false'
        }
    }

    buildFeatures {
        buildConfig true
    }
    testBuildType "release"
    compileSdk 36
    lint {
        abortOnError true
        checkReleaseBuilds true
        // Focus this gate on compatibility with the supported Android minimum.
        checkOnly 'NewApi'
        enable 'NewApi'
        fatal 'NewApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId 'com.transiva.customer'
        buildConfigField 'boolean', 'LOCAL_VERIFICATION', project.hasProperty('transivaLocalVerification') ? 'true' : 'false'
        manifestPlaceholders = [transivaTelemetryEnabled: project.hasProperty('transivaLocalVerification') ? 'false' : 'true']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 23
        targetSdk 36
        versionCode 55
        versionName '2.10.1'
    }

    signingConfigs {
        release {
            storeFile file("transiva-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
            storeType "pkcs12"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            signingConfig signingConfigs.release
            debuggable false

            // Keep JNI and reflective entry points, optimize the remaining release code.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Local verification and smoke builds must not upload mappings to production Firebase.
            firebaseCrashlytics {
                mappingFileUploadEnabled = !project.hasProperty('transivaLocalVerification')
                nativeSymbolUploadEnabled false
            }
        }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    // Shared with AndroidJUnitRunner. Keep one ABI in the app and instrumentation APK.
    implementation 'androidx.tracing:tracing:1.2.0'
    androidTestImplementation 'androidx.tracing:tracing:1.2.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    // Premium Trans Asisten animated mascot (offline Lottie asset)
    implementation 'com.airbnb.android:lottie:6.6.2'

    // Regression tests for critical customer order/chat state rules.
    testImplementation 'junit:junit:4.13.2'
    // Real JSON implementation for local JVM tests; Android's mockable jar throws at runtime.
    testImplementation 'org.json:json:20240303'

    // Native audio WebRTC (Maven Central)
    implementation 'io.github.webrtc-sdk:android:144.7559.09'

    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.biometric:biometric:1.1.0'

    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-core:1.4.1'

    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Google Maps native renderer. OSRM remains the routing engine.
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    // Smart destination search for TransRide/TransCar. 4.4.1 keeps minSdk 23 compatibility.
    implementation 'com.google.android.libraries.places:places:4.4.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
}
