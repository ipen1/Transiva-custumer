plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.transiva.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.transiva.customer'
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName '1.3-8.1'
    }

    signingConfigs {
        release {
            storeFile file("transiva-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
            storeType "pkcs12"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            signingConfig signingConfigs.release
            debuggable false

            // WebRTC stability fix:
            // Keep release bytecode/resources unmodified, matching the driver build.
            // The customer crash log stopped inside PeerConnectionFactory.initialize()
            // only on the optimized customer release build.
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    // Regression tests for critical customer order/chat state rules.
    testImplementation 'junit:junit:4.13.2'

    // Native audio WebRTC (Maven Central)
    implementation 'io.github.webrtc-sdk:android:144.7559.09'

    implementation 'androidx.activity:activity:1.9.3'

    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-core:1.4.1'

    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Google Maps native renderer. OSRM remains the routing engine.
    implementation 'com.google.android.gms:play-services-maps:20.0.0'

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
